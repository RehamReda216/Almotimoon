<section class="px-8 my-3">
  <div class="text-center">
    <h2 class="text-primary-600 text-xl md:text-2xl font-semibold">
      {{ title }}
    </h2>
    <p
      class="text-primary-800 text-sm md:text-base lg:text-xl font-medium my-4 leading-relaxed w-full md:w-2/3 lg:w-1/2 mx-auto"
    >
      {{ p }}
    </p>
    <app-button [background]="'bg-primary-800'" [textColor]="'text-white'"
      ><a>{{ btn }}</a></app-button
    >
  </div>
</section>
